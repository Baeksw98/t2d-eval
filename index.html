  <script>
    /* Legacy links (before the evaluations moved to /ca/ and /gc/). Keep query + hash.
       ?track=gc → gc/ · ?track=ca → ca/ · no track but ?type= / ?reset= / ?test= → ca/ (CA links already shared).
       A plain visit (including the printed CA QR /?src=qr) stays here on the landing page. */
    (function () {
      /* Entry referrer: once the visitor moves on to /ca/ or /gc/, document.referrer there is this page (same origin),
         so keep the external origin ('' = direct) for app.js / gc.js REF_ORIGIN (Visits/Sessions ReferrerOrigin). */
      try {
        var o = document.referrer ? new URL(document.referrer).origin : '';
        if (o !== location.origin) sessionStorage.setItem('t2d:entry_ref', o);
      } catch (e) {}
      try {
        var q = new URLSearchParams(location.search), t = (q.get('track') || '').toLowerCase(), d = '';
        if (t === 'gc') d = 'gc/';
        else if (t === 'ca') d = 'ca/';
        else if (!t && (q.has('type') || q.has('reset') || q.has('test'))) d = 'ca/';
        if (d) {
          q.delete('track');
          var s = q.toString();
          document.documentElement.style.visibility = 'hidden';
          location.replace(d + (s ? '?' + s : '') + location.hash);
        }
      } catch (e) {}
    })();
  </script>
