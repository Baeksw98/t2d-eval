<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- Source of assets/og.png (1200×630 link preview). Render: node tools/render_og.js -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; color: #fff; word-break: keep-all;
    background: #14304a; position: relative; -webkit-font-smoothing: antialiased;
  }
  .ring { position: absolute; right: -150px; top: -190px; width: 560px; height: 560px; border-radius: 50%; border: 70px solid rgba(255,255,255,.045); }
  .glow { position: absolute; left: -140px; bottom: -260px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(closest-side, rgba(31,138,126,.32), transparent); }
  .wrap { position: absolute; inset: 0; padding: 60px 64px; display: grid; grid-template-columns: 1fr 400px; gap: 48px; align-items: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 800; }
  .mark { width: 44px; height: 44px; border-radius: 12px; background: #e2702c; display: grid; place-items: center; }
  .brand small { display: block; font-size: 15px; font-weight: 600; opacity: .72; margin-top: 1px; }
  .eyebrow { margin-top: 44px; color: #f6b083; font-weight: 800; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin-top: 12px; font-size: 52px; line-height: 1.2; font-weight: 800; letter-spacing: -0.03em; }
  .tracks { display: flex; gap: 12px; margin-top: 30px; }
  .t { display: inline-flex; align-items: center; gap: 10px; padding: 11px 18px; border-radius: 14px; font-size: 21px; font-weight: 800; }
  .t.gc { background: rgba(87,196,182,.18); color: #b5ece4; }
  .t.ca { background: rgba(243,154,87,.2); color: #ffd3b1; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .gcd { background: #57c4b6; } .cad { background: #f39a57; }
  .url { margin-top: 30px; font-size: 19px; font-weight: 600; color: rgba(255,255,255,.72); }
  .card { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); border-radius: 22px; padding: 22px; box-shadow: 0 24px 60px rgba(0,0,0,.28); }
  .card .h { display: flex; justify-content: space-between; font-size: 16px; color: rgba(255,255,255,.75); }
  .card .h b { color: #fff; font-size: 18px; }
  ol { list-style: none; display: grid; gap: 9px; margin-top: 14px; }
  li { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; background: rgba(255,255,255,.07); border-radius: 12px; padding: 10px 12px; font-size: 18px; font-weight: 600; }
  li .n { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.16); display: grid; place-items: center; font-size: 14px; font-weight: 800; }
  li .m { display: inline-flex; gap: 6px; }
  li .m i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .leg { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 14px; }
  .leg div { border-radius: 12px; padding: 11px 13px; font-size: 15px; color: rgba(255,255,255,.78); line-height: 1.4; }
  .leg b { display: flex; align-items: center; gap: 8px; color: #fff; font-size: 16.5px; margin-bottom: 2px; }
  .leg .g { background: rgba(87,196,182,.18); } .leg .c { background: rgba(243,154,87,.18); }
</style>
</head>
<body>
  <div class="ring"></div><div class="glow"></div>
  <div class="wrap">
    <div>
      <div class="brand">
        <span class="mark"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9" stroke="white" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>T2D 벤치마크<small>Hybrid Physician–AI Benchmark</small></span>
      </div>
      <p class="eyebrow">의사 평가 참여</p>
      <h1>제2형 당뇨병 약물치료 AI,<br>의사 선생님과 함께<br>검증합니다</h1>
      <div class="tracks">
        <span class="t ca"><i class="dot cad"></i>임상 수용성 평가</span>
        <span class="t gc"><i class="dot gcd"></i>가이드라인 부합도 검증</span>
      </div>
      <p class="url">eval.asclep.org</p>
    </div>
    <div class="card">
      <div class="h"><b>AI 답변 1건</b><span>5단계 구조화 답변</span></div>
      <ol>
        <li><span class="n">1</span>환자 분류 및 의뢰<span class="m"><i class="cad"></i><i class="gcd"></i></span></li>
        <li><span class="n">2</span>약물 조합 요약<span class="m"><i class="cad"></i><i class="gcd"></i></span></li>
        <li><span class="n">3</span>약물 선택 고려사항<span class="m"><i class="cad"></i><i class="gcd"></i></span></li>
        <li><span class="n">4</span>추적관찰<span class="m"><i class="cad"></i><i class="gcd"></i></span></li>
        <li><span class="n">5</span>환자 교육<span class="m"><i class="cad"></i><i class="gcd"></i></span></li>
      </ol>
      <div class="leg">
        <div class="c"><b><i class="dot cad"></i>임상 수용성</b>의사가 쓸 만한가</div>
        <div class="g"><b><i class="dot gcd"></i>가이드라인 부합도</b>진료지침을 따르는가</div>
      </div>
    </div>
  </div>
</body>
</html>
